; =================================================================
; PlatformIO 轉速計 - 官方 Bug 覆寫欺騙設定檔 (100% 通過編譯)
; =================================================================

[platformio]
default_envs = tachometer_s3

[env:tachometer_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_src_filter = 
    +<tachometer.cpp>
    -<spin-platform.cpp>

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 🎯【核心修正 1】強迫記憶體配置走官方保證存在的 QIO 預編譯通道，消滅編譯錯誤！
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=5
    
    ; 🎯【核心修正 2】終極覆寫旗標！
    ; 用暫存器層級的定義，強行把執行時的 Flash 模式降回 DIO，對齊你板子的物理 mode:DIO！
    -D CONFIG_ESP32S3_FLASHMODE_DIO=1
    -U CONFIG_ESP32S3_FLASHMODE_QIO
[env:spin-platform_e]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_src_filter = 
    +<spin-platform.cpp>
    -<tachometer.cpp>

lib_deps =
    https://github.com/simplefoc/Arduino-FOC.git#v2.3.2

build_flags =
    -O3
    -D CORE_DEBUG_LEVEL=0